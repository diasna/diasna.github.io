### Site Settings ###
title               : Dias
description         : >-
                      I build web and mobile solutions using Java, Python, React, and modern tools.
                      Always exploring new tech and refining skills through real-world development.
baseurl             : ""
repository          : diasna/diasna.github.io
remote_theme        : yousinix/portfolYOU
open_new_tab        : false


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md


