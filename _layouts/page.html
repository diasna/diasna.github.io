---
layout: default
---

<div class="max-w-4xl mx-auto px-6 py-16">
    <!-- Page Header -->
    {% if page.title %}
    <header class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-bold text-neutral-800 mb-6">{{ page.title }}</h1>
        {% if page.description %}
            <p class="text-xl text-neutral-600 max-w-3xl mx-auto leading-relaxed">{{ page.description }}</p>
        {% endif %}
    </header>
    {% endif %}

    <!-- Page Content -->
    <div class="prose prose-neutral max-w-none">
        {{ content }}
    </div>
</div>
