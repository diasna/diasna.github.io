<div class="chatgpt-container">
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-12">
                <div class="chat-interface">
                    <!-- Chat Messages Area -->
                    <div class="chat-messages" id="chatMessages">
                        <!-- Welcome message -->
                        <div class="message-row assistant">
                            <div class="message-content">
                                <div class="message-text">
                                    Ask me anything!
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Chat Input -->
                    <div class="chat-input-container">
                        <div class="chat-input-wrapper">
                            <div class="input-box">
                                <textarea id="messageInput" placeholder="Message ChatGPT..." rows="1"></textarea>
                                <button class="send-button" type="button" id="sendButton">
                                    <i class="fas fa-arrow-up"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const chatMessages = document.getElementById('chatMessages');

    function addMessage(content, isUser = false) {
        const messageRow = document.createElement('div');
        messageRow.className = `message-row ${isUser ? 'user' : 'assistant'}`;
        
        messageRow.innerHTML = `
            <div class="message-avatar">
                <div class="avatar-circle ${isUser ? 'user-avatar' : 'assistant-avatar'}">
                    <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                </div>
            </div>
            <div class="message-content">
                <div class="message-text">${content}</div>
            </div>
        `;
        
        chatMessages.appendChild(messageRow);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
        const message = messageInput.value.trim();
        if (message) {
            // Add user message
            addMessage(message, true);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Simulate AI response (replace with actual API call)
            setTimeout(() => {
                const responses = [
                    "That's an interesting question! Let me think about it...",
                    "I understand what you're asking. Here's my perspective...",
                    "Thanks for sharing that with me. I'd be happy to help!",
                    "That's a great point. Let me provide some insights...",
                    "I appreciate you asking. Here's what I think..."
                ];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                addMessage(randomResponse, false);
            }, 1000);
        }
    }

    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    sendButton.addEventListener('click', sendMessage);
    
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Auto-focus on input
    messageInput.focus();
});
</script>
