<script type="module">

// Simple cosine similarity function
function cosineSimilarity(vecA, vecB) {
    const dotProduct = vecA.reduce((sum, a, i) => sum + a * vecB[i], 0);
    const magnitudeA = Math.sqrt(vecA.reduce((sum, a) => sum + a * a, 0));
    const magnitudeB = Math.sqrt(vecB.reduce((sum, b) => sum + b * b, 0));
    return dotProduct / (magnitudeA * magnitudeB);
}

// Simple text-to-vector embedding (for demo - in production use proper embeddings)
function simpleTextEmbedding(text) {
    // Expanded vocabulary to include personal and professional terms
    const words = text.toLowerCase().split(/\W+/).filter(w => w.length > 0);
    const vocab = [
        // Personal terms
        'dias', 'nurul', 'arifin', 'engineer', 'developer', 'experience', 'profile', 'resume', 'education', 'university',
        // Technical skills
        'java', 'python', 'spring', 'boot', 'fastapi', 'react', 'javascript', 'typescript', 'mongodb', 'postgresql',
        // Experience terms
        'backend', 'frontend', 'api', 'microservices', 'kafka', 'elasticsearch', 'docker', 'kubernetes', 'jenkins',
        // Company/project terms
        'asyx', 'heymiyagi', 'connexing', 'meruvian', 'finance', 'platform', 'mobile', 'app', 'android', 'ionic',
        // General tech terms
        'software', 'development', 'programming', 'database', 'architecture', 'tdd', 'testing', 'web', 'technology'
    ];
    
    return vocab.map(word => {
        const count = words.filter(w => w.includes(word) || word.includes(w)).length;
        return count / Math.max(words.length, 1); // Avoid division by zero
    });
}

// Initialize embeddings for knowledge base
function initializeEmbeddings() {
    knowledgeBase = sampleKnowledge.map(item => ({
        ...item,
        embedding: simpleTextEmbedding(item.text)
    }));
}

// Retrieve relevant context based on query
function retrieveContext(query, topK = 3) {
    const queryEmbedding = simpleTextEmbedding(query);
    
    const similarities = knowledgeBase.map(item => ({
        ...item,
        similarity: cosineSimilarity(queryEmbedding, item.embedding)
    }));
    
    // Sort by similarity and return top K
    const results = similarities
        .sort((a, b) => b.similarity - a.similarity)
        .slice(0, topK)
        .filter(item => item.similarity > 0.05); // Lower threshold for better recall
        
    console.log("Query:", query);
    console.log("Top results:", results.map(r => ({ text: r.text.substring(0, 50) + "...", similarity: r.similarity })));
    
    return results;
}

document.addEventListener('DOMContentLoaded', async function() {
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const chatMessages = document.getElementById('chatMessages');
    const initStatus = document.getElementById('initStatus');

    // Initialize WebLLM
    async function initializeWebLLM() {
        try {
            initStatus.textContent = "Loading WebLLM engine...";
            
            // Create engine with a small model
            engine = new webllm.MLCEngine();
            
            initStatus.textContent = "Downloading model... This may take a moment (~200MB).";
            
            // Initialize with TinyLlama (very small, ~200MB model)
            await engine.reload("TinyLlama-1.1B-Chat-v0.4-q4f16_1-MLC");
            
            initStatus.textContent = "Hi! I'm a local AI assistant with RAG capabilities running in your browser. How can I help you?";
            isInitialized = true;
            
            // Initialize embeddings
            initializeEmbeddings();
            console.log("Knowledge base initialized with", knowledgeBase.length, "items");
            
            // Enable input and button
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.placeholder = "Ask me anything...";
            messageInput.focus();
            
        } catch (error) {
            console.error("Failed to initialize WebLLM:", error);
            initStatus.textContent = "Failed to load AI model. Please refresh the page and try again.";
        }
    }

    function addMessage(content, isUser = false) {
        const messageRow = document.createElement('div');
        messageRow.className = `message-row ${isUser ? 'user' : 'assistant'}`;
        
        messageRow.innerHTML = `
            <div class="message-avatar">
                <div class="avatar-circle ${isUser ? 'user-avatar' : 'assistant-avatar'}">
                    <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                </div>
            </div>
            <div class="message-content">
                <div class="message-text">${content}</div>
            </div>
        `;
        
        chatMessages.appendChild(messageRow);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return messageRow;
    }

    async function sendMessage() {
        if (!isInitialized) {
            return;
        }

        const message = messageInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, true);
        messageInput.value = '';
        messageInput.style.height = 'auto';

        // Disable input while processing
        messageInput.disabled = true;
        sendButton.disabled = true;

        // Add thinking message
        const thinkingMessage = addMessage("Thinking...", false);

        try {
            // Retrieve relevant context using RAG
            const relevantContext = retrieveContext(message);
            
            // Build context string
            let contextString = "";
            if (relevantContext.length > 0) {
                contextString = "\n\nRelevant information:\n" + 
                    relevantContext.map(item => `- ${item.text} (Source: ${item.metadata.source})`).join("\n");
            }
            
            // Generate response using WebLLM with context
            const messages = [
                {
                    role: "system",
                    content: `You are a helpful AI assistant answering questions about Dias Nurul Arifin, a Software Engineer. Use the provided context to give accurate information about his background, experience, and skills. If no relevant context is provided, answer based on your general knowledge but mention that you don't have specific information about this person. Be conversational and helpful.`
                },
                {
                    role: "user",
                    content: message + contextString
                }
            ];

            const response = await engine.chat.completions.create({
                messages: messages,
                temperature: 0.8,
                max_tokens: 256
            });

            // Remove thinking message
            thinkingMessage.remove();

            // Add AI response with context info
            const aiResponse = response.choices[0].message.content;
            let fullResponse = aiResponse;
            
            // Add context sources if any were used
            if (relevantContext.length > 0) {
                const sources = [...new Set(relevantContext.map(item => item.metadata.source))];
                fullResponse += `\n\n📚 Sources: ${sources.join(", ")}`;
            }
            
            addMessage(fullResponse, false);

        } catch (error) {
            console.error("Error generating response:", error);
            thinkingMessage.querySelector('.message-text').textContent = 
                "Sorry, I encountered an error. Please try again.";
        }

        // Re-enable input
        messageInput.disabled = false;
        sendButton.disabled = false;
        messageInput.focus();
    }

    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    sendButton.addEventListener('click', sendMessage);
    
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Initialize WebLLM when page loads
    initializeWebLLM();
});
</script>
