// Simple cosine similarity function
function cosineSimilarity(vecA, vecB) {
    const dotProduct = vecA.reduce((sum, a, i) => sum + a * vecB[i], 0);
    const magnitudeA = Math.sqrt(vecA.reduce((sum, a) => sum + a * a, 0));
    const magnitudeB = Math.sqrt(vecB.reduce((sum, b) => sum + b * b, 0));
    return dotProduct / (magnitudeA * magnitudeB);
}

// Simple text-to-vector embedding (for demo - in production use proper embeddings)
function simpleTextEmbedding(text) {
    // Expanded vocabulary to include personal and professional terms
    const words = text.toLowerCase().split(/\W+/).filter(w => w.length > 0);
    const vocab = [
        // Personal terms
        'dias', 'nurul', 'arifin', 'engineer', 'developer', 'experience', 'profile', 'resume', 
        // Education terms
        'education', 'university', 'degree', 'major', 'bachelor', 'b.sc', 'information', 'technology', 'gunadarma', 'study', 'studied',
        // Technical skills
        'java', 'python', 'spring', 'boot', 'fastapi', 'react', 'javascript', 'typescript', 'mongodb', 'postgresql',
        // Experience terms
        'backend', 'frontend', 'api', 'microservices', 'kafka', 'elasticsearch', 'docker', 'kubernetes', 'jenkins',
        // Company/project terms
        'asyx', 'indonesia', 'heymiyagi', 'connexing', 'meruvian', 'finance', 'platform', 'mobile', 'app', 'android', 'ionic', 'freelance', 'worked', 'company', 'employer',
        // General tech terms
        'software', 'development', 'programming', 'database', 'architecture', 'tdd', 'testing', 'web', 'skills'
    ];
    
    return vocab.map(word => {
        const count = words.filter(w => w.includes(word) || word.includes(w)).length;
        return count / Math.max(words.length, 1); // Avoid division by zero
    });
}

// Initialize embeddings for knowledge base
function initializeEmbeddings() {
    knowledgeBase = sampleKnowledge.map(item => ({
        ...item,
        embedding: simpleTextEmbedding(item.text)
    }));
}

// Check if query is about Dias or within allowed context
function isQueryRelevant(query) {
    const queryLower = query.toLowerCase();
    
    // Keywords that indicate the query is about Dias
    const diasKeywords = ['dias', 'nurul', 'arifin'];
    const allowedTopics = [
        'experience', 'skill', 'education', 'work', 'project', 'technology', 'programming',
        'java', 'python', 'spring', 'developer', 'engineer', 'university', 'degree', 'major',
        'backend', 'frontend', 'database', 'asyx', 'heymiyagi', 'connexing', 'meruvian',
        'resume', 'background', 'profile', 'career', 'job', 'company', 'freelance'
    ];
    
    // Check if query mentions Dias explicitly or uses allowed topic keywords
    const mentionsDias = diasKeywords.some(keyword => queryLower.includes(keyword));
    const hasAllowedTopic = allowedTopics.some(topic => queryLower.includes(topic));
    
    // Also check for pronouns that might refer to Dias in context
    const hasPronouns = queryLower.match(/\b(he|his|him|you|your)\b/);
    
    return mentionsDias || hasAllowedTopic || hasPronouns;
}

// Retrieve relevant context based on query
function retrieveContext(query, topK = 2) {
    // First check if the query is relevant to our context
    if (!isQueryRelevant(query)) {
        return { isRelevant: false, results: [] };
    }
    
    const queryEmbedding = simpleTextEmbedding(query);
    const queryLower = query.toLowerCase();
    
    const similarities = knowledgeBase.map(item => ({
        ...item,
        similarity: cosineSimilarity(queryEmbedding, item.embedding)
    }));
    
    // Check for specific query types and filter accordingly
    let filteredItems = similarities;
    
    // If asking about education/major/degree/university, prioritize education category
    if (queryLower.includes('major') || queryLower.includes('degree') || queryLower.includes('education') || 
        queryLower.includes('university') || queryLower.includes('study') || queryLower.includes('studied')) {
        const educationItems = similarities.filter(item => 
            item.metadata.category === 'education' || 
            item.text.toLowerCase().includes('university') || 
            item.text.toLowerCase().includes('degree') ||
            item.text.toLowerCase().includes('b.sc')
        );
        if (educationItems.length > 0) {
            filteredItems = educationItems;
            topK = 1; // Only return the most relevant education item
        }
    }
    
    // If asking about skills/tech stack, prioritize skills category
    else if (queryLower.includes('skill') || queryLower.includes('technology') || queryLower.includes('tech stack') ||
             queryLower.includes('programming') || queryLower.includes('language')) {
        const skillItems = similarities.filter(item => item.metadata.category === 'skills');
        if (skillItems.length > 0) {
            filteredItems = skillItems;
        }
    }
    
    // If asking about companies/work/where worked, prioritize experience category
    else if (queryLower.includes('company') || queryLower.includes('companies') || queryLower.includes('worked') || 
             queryLower.includes('employer') || queryLower.includes('where') || queryLower.includes('job')) {
        const workItems = similarities.filter(item => 
            item.metadata.category === 'experience' || 
            item.text.toLowerCase().includes('asyx') ||
            item.text.toLowerCase().includes('heymiyagi') ||
            item.text.toLowerCase().includes('connexing') ||
            item.text.toLowerCase().includes('meruvian')
        );
        if (workItems.length > 0) {
            filteredItems = workItems;
        }
    }
    
    // Sort by similarity and return top K
    const results = filteredItems
        .sort((a, b) => b.similarity - a.similarity)
        .slice(0, topK)
        .filter(item => item.similarity > 0.1); // Higher threshold for better precision
        
    console.log("Query:", query);
    console.log("Top results:", results.map(r => ({ 
        text: r.text.substring(0, 50) + "...", 
        similarity: r.similarity,
        category: r.metadata.category 
    })));
    
    return { isRelevant: true, results };
}

// Format AI response as HTML list if it contains list-like content
function formatResponseAsHTML(text) {
    // Simple approach: just convert newlines to <br> and handle basic formatting
    let formatted = text.replace(/\n/g, '<br>');
    
    // Convert simple bullet points to HTML lists
    if (formatted.includes('- ') || formatted.includes('• ')) {
        // Replace bullet points with list items
        formatted = formatted.replace(/^(- |• )(.+)$/gm, '<li>$2</li>');
        
        // Wrap consecutive <li> elements in <ul>
        formatted = formatted.replace(/(<li>.*?<\/li>(<br>)?)+/g, function(match) {
            const items = match.replace(/<br>/g, '');
            return `<ul>${items}</ul>`;
        });
        
        // Clean up extra <br> tags around lists
        formatted = formatted.replace(/<br><ul>/g, '<ul>').replace(/<\/ul><br>/g, '</ul>');
    }
    
    return formatted;
}

document.addEventListener('DOMContentLoaded', async function() {
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const chatMessages = document.getElementById('chatMessages');
    const initStatus = document.getElementById('initStatus');
    const questionPresets = document.getElementById('questionPresets');
    const showPresetsContainer = document.getElementById('showPresetsContainer');
    const showPresetsBtn = document.getElementById('showPresetsBtn');
    const consentMessage = document.getElementById('consentMessage');
    const acceptConsent = document.getElementById('acceptConsent');
    const declineConsent = document.getElementById('declineConsent');

    // Handle consent acceptance
    acceptConsent.addEventListener('click', function() {
        consentMessage.style.display = 'none';
        initStatus.style.display = 'block';
        initializeWebLLM();
    });

    // Handle consent decline
    declineConsent.addEventListener('click', function() {
        consentMessage.innerHTML = '<p>AI features disabled. You can refresh the page to enable them.</p>';
    });

    // Show presets when system is ready
    function showPresets() {
        questionPresets.style.display = 'block';
        showPresetsContainer.style.display = 'none';
    }

    // Hide presets and show the "show presets" button
    function hidePresets() {
        questionPresets.style.display = 'none';
        showPresetsContainer.style.display = 'block';
    }

    // Handle preset button clicks
    function handlePresetClick(question) {
        messageInput.value = question;
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        hidePresets();
        sendMessage();
    }

    // Initialize WebLLM
    async function initializeWebLLM() {
        try {
            initStatus.textContent = "Loading WebLLM engine...";
            
            // Create engine with progress callback
            engine = new webllm.MLCEngine();
            
            initStatus.textContent = "Downloading model... This may take a moment (~200MB).";
            
            // Initialize with TinyLlama with progress tracking
            await engine.reload("TinyLlama-1.1B-Chat-v0.4-q4f16_1-MLC", {
                initProgressCallback: (progress) => {
                    if (progress.progress !== undefined) {
                        const percentage = Math.round(progress.progress * 100);
                        initStatus.textContent = `Downloading model... ${percentage}% complete`;
                    } else if (progress.text) {
                        initStatus.textContent = progress.text;
                    }
                }
            });
            
            initStatus.textContent = "Hi! I'm an AI assistant specialized in answering questions about Dias Nurul Arifin. Ask me about his education, experience, skills, or projects!";
            isInitialized = true;
            
            // Initialize embeddings
            initializeEmbeddings();
            console.log("Knowledge base initialized with", knowledgeBase.length, "items");
            
            // Enable input and button
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.placeholder = "Ask me about Dias - his education, experience, skills, or projects...";
            messageInput.focus();
            
            // Show question presets
            showPresets();
            
        } catch (error) {
            console.error("Failed to initialize WebLLM:", error);
            initStatus.textContent = "Failed to load AI model. Please refresh the page and try again.";
        }
    }

    function addMessage(content, isUser = false) {
        const messageRow = document.createElement('div');
        messageRow.className = `message-row ${isUser ? 'user' : 'assistant'}`;
        
        messageRow.innerHTML = `
            <div class="message-avatar">
                <div class="avatar-circle ${isUser ? 'user-avatar' : 'assistant-avatar'}">
                    <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                </div>
            </div>
            <div class="message-content">
                <div class="message-text">${content}</div>
            </div>
        `;
        
        chatMessages.appendChild(messageRow);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return messageRow;
    }

    async function sendMessage() {
        if (!isInitialized) {
            return;
        }

        const message = messageInput.value.trim();
        if (!message) return;

        // Hide presets after first user message
        hidePresets();

        // Add user message
        addMessage(message, true);
        messageInput.value = '';
        messageInput.style.height = 'auto';

        // Disable input while processing
        messageInput.disabled = true;
        sendButton.disabled = true;

        // Add thinking message
        const thinkingMessage = addMessage("Thinking...", false);

        try {
            // Retrieve relevant context using RAG
            const contextResult = retrieveContext(message);
            
            // Check if query is relevant to our context
            if (!contextResult.isRelevant) {
                thinkingMessage.remove();
                addMessage("I'm specifically designed to answer questions about Dias Nurul Arifin - his background, experience, skills, education, and career. Please ask me something about Dias!", false);
                
                // Re-enable input
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
                return;
            }
            
            const relevantContext = contextResult.results;
            
            // If no relevant context found even for a relevant query
            if (relevantContext.length === 0) {
                thinkingMessage.remove();
                addMessage("I don't have specific information about that aspect of Dias. Please try asking about his education, work experience, skills, or projects.", false);
                
                // Re-enable input
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
                return;
            }
            
            // Build context string
            let contextString = "";
            if (relevantContext.length > 0) {
                contextString = "\n\nContext:\n" + 
                    relevantContext.map(item => `${item.text}`).join("\n");
            }
            
            // Generate response using WebLLM with context
            const messages = [
                {
                    role: "system",
                    content: `You are a helpful AI assistant that can ONLY answer questions about Dias Nurul Arifin using the specific information provided in the context. 

STRICT RULES:
- ONLY use information from the provided context
- DO NOT make up, invent, or assume any information
- DO NOT mention projects, companies, or details not explicitly stated in the context
- If the context doesn't contain the answer, say "I don't have that specific information about Dias"
- Keep responses factual and brief
- Only state what is explicitly mentioned in the provided context`
                },
                {
                    role: "user",
                    content: message + contextString
                }
            ];

            const response = await engine.chat.completions.create({
                messages: messages,
                temperature: 0.3,
                max_tokens: 200
            });

            // Remove thinking message
            thinkingMessage.remove();

            // Add AI response with context info
            let aiResponse = response.choices[0].message.content;
            
            // Format response as HTML list if it contains list-like content
            aiResponse = formatResponseAsHTML(aiResponse);
            
            let fullResponse = aiResponse;
            
            // Add context sources if any were used
            if (relevantContext.length > 0) {
                const sources = [...new Set(relevantContext.map(item => item.metadata.source))];
                fullResponse += `\n\n📚 Sources: ${sources.join(", ")}`;
            }
            
            addMessage(fullResponse, false);

        } catch (error) {
            console.error("Error generating response:", error);
            thinkingMessage.querySelector('.message-text').textContent = 
                "Sorry, I encountered an error. Please try again.";
        }

        // Re-enable input
        messageInput.disabled = false;
        sendButton.disabled = false;
        messageInput.focus();
    }

    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    sendButton.addEventListener('click', sendMessage);
    
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Add event listeners for preset buttons
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('preset-btn')) {
            const question = e.target.getAttribute('data-question');
            handlePresetClick(question);
        }
    });

    // Add event listener for show presets button
    showPresetsBtn.addEventListener('click', function() {
        showPresets();
    });
});
</script>
