<!-- Modern Chat Interface -->
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 col-12">
      
      <!-- Chat Container -->
      <div class="modern-chat-container card border-0 shadow-sm">
        
        <!-- Chat Messages Area -->
        <div class="chat-messages-area" id="chatMessages">
          <!-- Welcome Message -->
          <div class="message-container agent-message" id="welcomeMessage">
            <div class="d-flex align-items-start mb-3">
              <div class="agent-avatar rounded-circle bg-primary d-flex align-items-center justify-content-center mr-3">
                <i class="fas fa-robot text-white agent-icon"></i>
              </div>
              <div class="message-bubble agent-bubble">
                <div class="message-content">
                  <p class="mb-2"><strong>👋 Welcome!</strong></p>
                  <p class="mb-0">I'm your AI assistant. How can I help you today?</p>
                </div>
                <div class="message-timestamp">
                  <small class="text-muted">Just now</small>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Chat Input Footer -->
        <div class="chat-input-area border-top p-3">
          <div class="d-flex align-items-end gap-2">
            <textarea 
              class="form-control border-0 bg-light rounded-pill flex-grow-1" 
              id="messageInput" 
              placeholder="Type your message..." 
              rows="1"
              onkeydown="handleKeyPress(event)"
            ></textarea>
            <button 
              class="btn btn-primary rounded-pill d-flex align-items-center justify-content-center send-button" 
              id="sendButton" 
              onclick="sendMessage()"
            >
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>

<script>
// Chat functionality
let messageCount = 0;

function handleKeyPress(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function sendMessage() {
  const messageInput = document.getElementById('messageInput');
  const message = messageInput.value.trim();
  
  if (!message) return;
  
  // Add user message
  addMessage(message, 'user');
  messageInput.value = '';
  
  // Auto-resize textarea back to original size
  messageInput.style.height = 'auto';
  
  // Simulate AI response
  setTimeout(() => {
    showTypingIndicator();
    setTimeout(() => {
      hideTypingIndicator();
      addMessage(generateResponse(message), 'agent');
    }, 1500);
  }, 300);
}

function addMessage(content, sender) {
  const chatMessages = document.getElementById('chatMessages');
  const messageContainer = document.createElement('div');
  messageContainer.className = `message-container ${sender}-message`;
  
  const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  
  if (sender === 'user') {
    messageContainer.innerHTML = `
      <div class="d-flex justify-content-end">
        <div class="message-bubble user-bubble">
          <div class="message-content">
            <p class="mb-0">${escapeHtml(content)}</p>
          </div>
          <div class="message-timestamp">
            <small class="text-light user-timestamp">${timestamp}</small>
          </div>
        </div>
      </div>
    `;
  } else {
    messageContainer.innerHTML = `
      <div class="d-flex align-items-start">
        <div class="agent-avatar rounded-circle bg-primary d-flex align-items-center justify-content-center mr-3">
          <i class="fas fa-robot text-white agent-icon"></i>
        </div>
        <div class="message-bubble agent-bubble">
          <div class="message-content">
            <p class="mb-0">${escapeHtml(content)}</p>
          </div>
          <div class="message-timestamp">
            <small class="text-muted">${timestamp}</small>
          </div>
        </div>
      </div>
    `;
  }
  
  chatMessages.appendChild(messageContainer);
  scrollToBottom();
  messageCount++;
}

function showTypingIndicator() {
  const chatMessages = document.getElementById('chatMessages');
  const typingIndicator = document.createElement('div');
  typingIndicator.id = 'typingIndicator';
  typingIndicator.className = 'message-container agent-message';
  typingIndicator.innerHTML = `
    <div class="d-flex align-items-start">
      <div class="agent-avatar rounded-circle bg-primary d-flex align-items-center justify-content-center mr-3">
        <i class="fas fa-robot text-white agent-icon"></i>
      </div>
      <div class="message-bubble agent-bubble">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>
  `;
  chatMessages.appendChild(typingIndicator);
  scrollToBottom();
}

function hideTypingIndicator() {
  const typingIndicator = document.getElementById('typingIndicator');
  if (typingIndicator) {
    typingIndicator.remove();
  }
}

function scrollToBottom() {
  const chatMessages = document.getElementById('chatMessages');
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function clearChat() {
  const chatMessages = document.getElementById('chatMessages');
  chatMessages.innerHTML = `
    <div class="message-container agent-message" id="welcomeMessage">
      <div class="d-flex align-items-start mb-3">
        <div class="agent-avatar rounded-circle bg-primary d-flex align-items-center justify-content-center mr-3">
          <i class="fas fa-robot text-white agent-icon"></i>
        </div>
        <div class="message-bubble agent-bubble">
          <div class="message-content">
            <p class="mb-2"><strong>👋 Welcome!</strong></p>
            <p class="mb-0">I'm your AI assistant. How can I help you today?</p>
          </div>
          <div class="message-timestamp">
            <small class="text-muted">Just now</small>
          </div>
        </div>
      </div>
    </div>
  `;
  messageCount = 0;
}

function generateResponse(userMessage) {
  // Simple response generator for demo purposes
  const responses = [
    "That's an interesting question! Let me think about that...",
    "I understand what you're asking. Here's what I can tell you:",
    "Great question! Based on my knowledge, I would say:",
    "Thanks for asking! From my perspective:",
    "That's a thoughtful inquiry. My response would be:",
    "I appreciate you bringing this up. Here's my take:"
  ];
  
  const randomResponse = responses[Math.floor(Math.random() * responses.length)];
  
  // Add some context based on the message
  if (userMessage.toLowerCase().includes('help')) {
    return "I'm here to help! You can ask me about various topics, and I'll do my best to provide helpful information.";
  } else if (userMessage.toLowerCase().includes('hello') || userMessage.toLowerCase().includes('hi')) {
    return "Hello! It's great to meet you. What would you like to chat about today?";
  } else if (userMessage.toLowerCase().includes('time')) {
    return `The current time is ${new Date().toLocaleTimeString()}. Is there anything else I can help you with?`;
  } else {
    return `${randomResponse} Though this is a demo interface, in a real implementation, I would provide more detailed and contextual responses based on your question: "${userMessage}"`;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

// Auto-resize textarea
document.getElementById('messageInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Focus on input when page loads
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('messageInput').focus();
});
</script>
